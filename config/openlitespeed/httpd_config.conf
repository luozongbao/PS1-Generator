#
# PS1 Generator — global OLS config (issue 001)
#
# Replaces the base image's default httpd_config.conf. We strip out
# everything we don't need (Rails, Node, WSGI templates, centralConfigLog,
# cache module) and declare a single vhost called "ps1" wired to a
# single Default listener on port 80.
#
# PHP is wired to the base image's bundled LSPHP via the `lsphp`
# extProcessor + scriptHandler.
#

# --- server identity / runtime ---
serverName              ps1-generator
user                    nobody
group                   nogroup
priority                0
autoRestart             1

enableChroot            0
chrootPath              /

inMemBufSize            60M
swappingDir             /tmp/lsws/swap
autoFix503              1

gracefulRestartTimeout  300

mime                    conf/mime.properties
showVersionNumber       0
adminEmails             root@localhost

indexFiles              index.php, index.html
disableWebAdmin         1

# --- logs ---
errorlog /var/log/lsws/error.log {
  logLevel              WARN
  rollingSize           10M
  enableStderrLog       1
}

accessLog /var/log/lsws/access.log {
  rollingSize           10M
  keepDays              30
  logReferer            1
  logUserAgent          1
}

# --- resource limits ---
tuning {
  maxConnections        1024
  maxSSLConnections     1024
  connTimeout           300
  maxKeepAliveReq       10000
  keepAliveTimeout      5
  sndBufSize            0
  rcvBufSize            0
  gzipStaticCompressLevel 6
  gzipMaxFileSize       10M
  eventDispatcher       best
  maxCachedFileSize     4096
  totalInMemCacheSize   20M
  maxMMapFileSize       256K
  totalMMapCacheSize    40M
  useSendfile           1
  fileETag              28
  maxReqURLLen          32768
  maxReqHeaderSize      65536
  maxReqBodySize        2047M
  maxDynRespHeaderSize  32768
  maxDynRespSize        2047M
  enableGzipCompress    1
  enableBrCompress      4
  enableDynGzipCompress 1
  gzipCompressLevel     6
  gzipAutoUpdateStatic  1
  gzipMinFileSize       300
}

# --- security: deny access to sensitive dirs ---
accessDenyDir {
  dir                   /
  dir                   /etc/*
  dir                   /dev/*
  dir                   conf/*
  dir                   admin/conf/*
}

fileAccessControl {
  followSymbolLink      1
  checkSymbolLink       0
  requiredPermissionMask 000
  restrictedPermissionMask 000
}

accessControl {
  allow                 ALL
  deny
}

# --- PHP via the base image's bundled LSPHP ---
extProcessor lsphp {
  type                  lsapi
  address               uds:/tmp/lshttpd/lsphp.sock
  maxConns              10
  env                   PHP_LSAPI_CHILDREN=10
  env                   LSAPI_AVOID_FORK=200M
  initTimeout           60
  retryTimeout          0
  persistConn           1
  pcKeepAliveTimeout    60
  respBuffer            0
  autoStart             1
  path                  fcgi-bin/lsphp
  backlog               100
  instances             1
  priority              0
  memSoftLimit          0
  memHardLimit          0
  procSoftLimit         1400
  procHardLimit         1500
}

scriptHandler {
  add                   lsapi:lsphp php
}

# --- single vhost + listener ---
virtualHost ps1 {
  vhRoot                /
  allowSymbolLink       1
  enableScript          1
  restrained            1
  setUIDMode            0
  chrootMode            0
  configFile            conf/vhosts/ps1/vhconf.conf
}

listener Default {
  address               *:80
  secure                0
  map                   ps1 *
}