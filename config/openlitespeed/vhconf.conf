#
# PS1 Generator — virtual host config (issue 001)
#
# This file lives at /usr/local/lsws/conf/vhosts/ps1/vhconf.conf inside
# the container. It is bind-mounted from ./config/openlitespeed/ on the
# host, so edits take effect without rebuilding the image. A restart of
# the OLS service inside the container is required to pick up changes
# here (docker compose restart web).
#

docRoot                   /var/www/html
vhDomain                  *
enableScript              1
restrained                1

indexFiles                index.php, index.html

# PHP execution is enabled via the global scriptHandler in
# httpd_config.conf (`add lsapi:lsphp php`). No per-vhost override needed.

# Static assets are served directly by OLS (no PHP). The includes/
# and assets/ subdirectories are inside the docRoot, which is fine —
# OLS will not execute *.php under them unless explicitly requested,
# and any file with no PHP handler mapping (css/js/json/svg) is served
# as static.

accessLog  /var/log/lsws/access.log {
  logFormat                "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\""
  rollingSize              10M
  keepDays                 30
}

errorLog  /var/log/lsws/error.log {
  logLevel                 WARN
  rollingSize              10M
  keepDays                 30
}

# Minimal security: deny access to dotfiles and any backup-style files.
rewrite  {
  enable                   1
  autoLoadHtaccess         1
  rules                    <<<END_RULES
RewriteRule \.(?!well-known)            - [F,L]
RewriteRule (?i)\.(bak|swp|dist|env)$   - [F,L]
END_RULES
}